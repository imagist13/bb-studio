<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">bb-studio 架构</title>
  <desc id="archDesc">bb-studio 桌面壳通过 REST 和 WebSocket 驱动 bbcore agent runtime，bbcore 通过 bbdev MCP 工具操作 Buckyball 仓库；外部 CLI agent 经 ACP 接入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
    <style>
      .title { font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #1f2328; }
      .sub { font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #57606a; }
      .body { font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #24292f; }
      .small { font: 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #57606a; }
      .pill { font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #24292f; }
      .arrowLabel { font: 10.5px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #57606a; }
      .edge { stroke: #6b7280; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="630" rx="16" fill="#ffffff" />

  <!-- bb-studio -->
  <rect x="40" y="40" width="880" height="190" rx="14" fill="#f7faff" stroke="#c9d9f2" />
  <text x="64" y="72" class="title">bb-studio</text>
  <text x="140" y="72" class="sub">Electron · React 19 · TypeScript</text>

  <rect x="64" y="88" width="300" height="118" rx="10" fill="#e8f0fe" stroke="#b3c7ea" />
  <text x="80" y="112" class="body" font-weight="600">渲染进程 Renderer</text>
  <text x="80" y="135" class="small">聊天 · Guid · EDA 工作台（总览 / 芯片 / Ball / 波形）</text>
  <text x="80" y="156" class="small">Arco Design · UnoCSS · 13 种语言</text>
  <text x="80" y="177" class="small">固定工作区间 · 可停靠 agent 会话</text>

  <rect x="384" y="88" width="150" height="118" rx="10" fill="#eef1f5" stroke="#cbd2d9" />
  <text x="400" y="112" class="body" font-weight="600">Preload</text>
  <text x="400" y="135" class="small">类型化 IPC</text>
  <text x="400" y="156" class="small">REST / WebSocket</text>
  <text x="400" y="177" class="small">客户端 · 端口注入</text>

  <rect x="554" y="88" width="342" height="118" rx="10" fill="#eef1f5" stroke="#cbd2d9" />
  <text x="570" y="112" class="body" font-weight="600">主进程 Main</text>
  <text x="570" y="135" class="small">窗口 · 菜单 · 自动更新 · 多实例隔离</text>
  <text x="570" y="156" class="small">spawn bbcore 子进程，注入端口与配置</text>
  <text x="570" y="177" class="small">处理 Electron 原生能力（文件、对话框、剪贴板）</text>

  <path class="edge" d="M 364 147 L 380 147" marker-end="url(#arrow)" />
  <path class="edge" d="M 534 147 L 550 147" marker-end="url(#arrow)" />

  <!-- bbcore -->
  <rect x="40" y="280" width="560" height="140" rx="14" fill="#fff8ee" stroke="#f0d3a8" />
  <text x="64" y="312" class="title">bbcore</text>
  <text x="126" y="312" class="sub">bb-agent-core · Rust 单二进制</text>

  <rect x="64" y="330" width="120" height="46" rx="8" fill="#ffffff" stroke="#e8c793" />
  <text x="124" y="358" class="pill" text-anchor="middle">agent loop</text>
  <rect x="194" y="330" width="120" height="46" rx="8" fill="#ffffff" stroke="#e8c793" />
  <text x="254" y="358" class="pill" text-anchor="middle">assistants</text>
  <rect x="324" y="330" width="120" height="46" rx="8" fill="#ffffff" stroke="#e8c793" />
  <text x="384" y="358" class="pill" text-anchor="middle">skills × 17</text>
  <rect x="454" y="330" width="122" height="46" rx="8" fill="#ffffff" stroke="#e8c793" />
  <text x="515" y="352" class="pill" text-anchor="middle">MCP</text>
  <text x="515" y="367" class="small" text-anchor="middle">bbdev · waveform</text>

  <!-- external agents -->
  <rect x="640" y="280" width="280" height="140" rx="14" fill="#f7f2ff" stroke="#d8c8f0" />
  <text x="664" y="312" class="title">外部 CLI agent</text>
  <text x="664" y="338" class="small">Claude Code · Codex · Gemini 等</text>
  <text x="664" y="360" class="small">经 ACP 接入，与内置 agent</text>
  <text x="664" y="379" class="small">共用同一会话界面</text>

  <path class="edge" d="M 640 350 L 604 350" marker-end="url(#arrow)" />
  <text x="606" y="342" class="arrowLabel">ACP</text>

  <!-- shell -> runtime -->
  <path class="edge" d="M 560 230 L 560 276" marker-end="url(#arrow)" />
  <text x="568" y="258" class="arrowLabel">REST + WebSocket · spawn</text>

  <!-- bbdev -->
  <rect x="330" y="445" width="200" height="30" rx="8" fill="#fff3e0" stroke="#f0d3a8" />
  <text x="430" y="465" class="pill" text-anchor="middle">bbdev CLI（MCP 工具）</text>
  <path class="edge" d="M 430 420 L 430 441" marker-end="url(#arrow)" />
  <path class="edge" d="M 430 475 L 430 496" marker-end="url(#arrow)" />

  <!-- buckyball -->
  <rect x="40" y="500" width="880" height="90" rx="14" fill="#eefaf2" stroke="#b7e0c6" />
  <text x="64" y="532" class="title">Buckyball 仓库</text>
  <text x="184" y="532" class="sub">Chisel / Scala · 共享内存 NoC mesh_shm</text>
  <text x="64" y="558" class="small">Ball 契约：C 测试 / BEMU 黄金模型 → 编译器 lowering / MLIR → RTL / Verilator → PPA / UVM</text>
  <text x="64" y="577" class="small">bbdev_* 负责构建、workload、仿真与综合；门控失败阻断后续阶段</text>
</svg>
